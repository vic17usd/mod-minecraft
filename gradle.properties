# Ajustes conservadores para una compilación de Minecraft con Java 21.
org.gradle.jvmargs=-Xmx3G -Dfile.encoding=UTF-8
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.workers.max=2

# Versiones exactas: NeoForge 21.0.x corresponde a Minecraft 1.21, no a 1.21.1.
minecraft_version=1.21
minecraft_version_range=[1.21]
neo_version=21.0.167
neo_version_range=[21.0.167,21.1)
loader_version_range=[4,)

# Identidad compartida por el JAR y los metadatos. El MOD_ID de Java debe coincidir.
mod_id=galaxycraft
mod_name=GalaxyCraft
mod_version=0.4.0
mod_group_id=com.vic17usd.galaxycraft
mod_authors=vic17usd
mod_license=All Rights Reserved
