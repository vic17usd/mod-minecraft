# Los marcadores se sustituyen desde gradle.properties al generar los recursos.
modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
authors="${mod_authors}"
description='''
Exploración del Sistema Solar con oxígeno, cohetes, estructuras, recursos originales y HUD espacial.
'''

# El intervalo se limita a la línea 21.0 para evitar prometer compatibilidad con 1.21.1.
[[dependencies.${mod_id}]]
modId="neoforge"
type="required"
versionRange="${neo_version_range}"
ordering="NONE"
side="BOTH"

[[dependencies.${mod_id}]]
modId="minecraft"
type="required"
versionRange="${minecraft_version_range}"
ordering="NONE"
side="BOTH"
